# LyreBirdAudio - Bash CI Pipeline
# Runs the full validation on every pull request to main/master and on every
# push to main/master, with no path filter: scripts, tests, workflows,
# configuration and documentation changes are all checked. It also runs weekly
# and on demand, and release.yml calls it (workflow_call) so a release is
# validated by exactly the checks a pull request passes.
#
# Tools included (all free, open source, no API/subscription required):
#   - bash -n: Built-in syntax validation
#   - shellcheck: Static analysis (industry standard)
#   - shfmt: Format/style consistency checking
#   - bashate: OpenStack's bash style linter
#   - actionlint: lints these workflows (and ShellCheck-checks every run: script)
#   - bats: the test suite, and live tests against real MediaMTX releases
#
# Author: Tom F (https://github.com/tomtom215)
# License: Apache 2.0

name: Bash CI

on:
  pull_request:
    branches:
      - main
      - master

  push:
    branches:
      - main
      - master

  # Weekly, so a changed runner image or a new upstream MediaMTX release is
  # noticed even when nobody pushes. Scheduled runs use the default branch.
  schedule:
    - cron: '23 4 * * 1'

  # Allow manual trigger for testing
  workflow_dispatch:

  # Reused by release.yml to validate a tagged commit
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Cancel superseded runs of the same pull request only. A run on main (or a
# tag) always finishes, so every merged commit keeps its verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Downloaded tools: the version and the sha256 of the exact file the install
  # step downloads. A download that does not match is never installed. Bump a
  # version and its hash together.
  #
  # ShellCheck v0.11.0 and shfmt v3.13.1 publish no checksum file, so those two
  # hashes were computed from the downloaded release assets (two independent
  # downloads agreed). actionlint's is from the checksums file of its release.
  # https://github.com/koalaman/shellcheck/releases
  SHELLCHECK_VERSION: 'v0.11.0'
  # shellcheck-v0.11.0.linux.x86_64.tar.xz
  SHELLCHECK_SHA256: '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198'
  # https://github.com/mvdan/sh/releases
  SHFMT_VERSION: 'v3.13.1'
  # shfmt_v3.13.1_linux_amd64
  SHFMT_SHA256: 'fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1'
  # https://github.com/rhysd/actionlint/releases
  ACTIONLINT_VERSION: 'v1.7.12'
  # actionlint_1.7.12_linux_amd64.tar.gz
  ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

jobs:
  # ===========================================================================
  # Job 1: Discover shell scripts
  # ===========================================================================
  discover-scripts:
    name: Discover Scripts
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.find-scripts.outputs.scripts }}
      script_count: ${{ steps.find-scripts.outputs.count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Find shell scripts
        id: find-scripts
        run: |
          # Find all .sh files, output as JSON array
          scripts=$(find . -name '*.sh' -type f | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "scripts=${scripts}" >> "$GITHUB_OUTPUT"

          # Count for display
          count=$(echo "$scripts" | jq '. | length')
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Found ${count} shell scripts"

  # ===========================================================================
  # Job 1b: Lint the workflows themselves (actionlint)
  #
  # actionlint also runs ShellCheck over every `run:` script, so the pinned
  # ShellCheck is installed here as well.
  # ===========================================================================
  workflow-lint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install ShellCheck (pinned, sha256-verified)
        run: |
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          sudo install -m 0755 "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Install actionlint (pinned, sha256-verified)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          sudo install -m 0755 "${RUNNER_TEMP}/actionlint" /usr/local/bin/actionlint
          actionlint -version

      - name: Lint the workflows
        run: actionlint -color

  # ===========================================================================
  # Job 2: Bash Syntax Validation (bash -n)
  # ===========================================================================
  bash-syntax:
    name: Bash Syntax Check
    runs-on: ubuntu-latest
    needs: discover-scripts
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Validate bash syntax (bash -n)
        run: |
          echo "============================================"
          echo "Bash Syntax Validation (bash -n)"
          echo "============================================"
          echo ""

          errors=0
          success=0

          while IFS= read -r script; do
            if bash -n "$script" 2>&1; then
              echo "[PASS] $script"
              success=$((success + 1))
            else
              echo "[FAIL] $script"
              errors=$((errors + 1))
            fi
          done < <(find . -name '*.sh' -type f | sort)

          echo ""
          echo "============================================"
          echo "Results: ${success} passed, ${errors} failed"
          echo "============================================"

          if [[ $errors -gt 0 ]]; then
            echo "::error::Bash syntax validation failed for ${errors} script(s)"
            exit 1
          fi

  # ===========================================================================
  # Job 3: ShellCheck Static Analysis
  # ===========================================================================
  shellcheck:
    name: ShellCheck Analysis
    runs-on: ubuntu-latest
    needs: discover-scripts
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install ShellCheck (pinned, sha256-verified)
        run: |
          # Always the pinned version: the runner image's own shellcheck can be
          # any version, and the gate is defined against this one.
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          sudo install -m 0755 "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Run ShellCheck
        run: |
          echo "============================================"
          echo "ShellCheck Static Analysis"
          echo "============================================"
          echo "Version: $(shellcheck --version | grep version:)"
          echo ""

          # Collect all scripts
          scripts=$(find . -name '*.sh' -type f | sort)

          # Run shellcheck with GitHub Actions format for annotations
          # Severity: error, warning (style and info are informational)
          echo "Running shellcheck on all scripts..."
          echo ""

          exit_code=0

          for script in $scripts; do
            echo "Checking: $script"
            if ! shellcheck \
              --format=gcc \
              --severity=warning \
              --external-sources \
              --shell=bash \
              "$script"; then
              exit_code=1
            fi
          done

          echo ""
          echo "============================================"

          if [[ $exit_code -eq 0 ]]; then
            echo "ShellCheck: All scripts passed (0 errors, 0 warnings)"
          else
            echo "::error::ShellCheck found issues that need to be fixed"
            exit 1
          fi

      - name: ShellCheck Summary Report
        if: always()
        run: |
          {
            echo "## ShellCheck Detailed Report"
            echo ""
            echo "| Script | Errors | Warnings | Notes |"
            echo "|--------|--------|----------|-------|"
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r script; do
            # The tool exits 1 when it finds anything, which is not an error here
            report=$(shellcheck --format=json "$script" 2>/dev/null || true)
            errors=$(jq '[.[] | select(.level == "error")] | length' <<<"${report:-[]}")
            warnings=$(jq '[.[] | select(.level == "warning")] | length' <<<"${report:-[]}")
            notes=$(jq '[.[] | select(.level == "info" or .level == "style")] | length' <<<"${report:-[]}")

            if [[ "$errors" == "0" && "$warnings" == "0" ]]; then
              status="PASS"
            else
              status="FAIL"
            fi

            echo "| ${status} ${script} | ${errors} | ${warnings} | ${notes} |" >> "$GITHUB_STEP_SUMMARY"
          done < <(find . -name '*.sh' -type f | sort)

  # ===========================================================================
  # Job 4: shfmt Format Check
  # ===========================================================================
  shfmt:
    name: Format Check (shfmt)
    runs-on: ubuntu-latest
    needs: discover-scripts
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install shfmt (pinned, sha256-verified)
        run: |
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/shfmt" \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  ${RUNNER_TEMP}/shfmt" | sha256sum -c -
          sudo install -m 0755 "${RUNNER_TEMP}/shfmt" /usr/local/bin/shfmt
          echo "Installed: $(shfmt --version)"

      - name: Check formatting with shfmt
        run: |
          echo "============================================"
          echo "shfmt Format Consistency Check"
          echo "============================================"
          echo ""
          echo "Settings: indent=4 spaces, binary-ops-start-of-line, case-indent"
          echo ""

          # Check formatting (diff mode shows what would change)
          # Using common settings for bash scripts
          errors=0

          while IFS= read -r script; do
            echo -n "Checking: $script ... "

            # -d shows diff, -i 4 = 4 space indent, -bn = binary ops at start of line
            # -ci = indent case statements
            if diff=$(shfmt -d -i 4 -bn -ci "$script" 2>&1); then
              echo "[PASS]"
            else
              echo "needs formatting"
              echo "$diff"
              errors=$((errors + 1))
            fi
          done < <(find . -name '*.sh' -type f | sort)

          echo ""
          echo "============================================"

          if [[ $errors -gt 0 ]]; then
            echo "::error::${errors} script(s) have formatting inconsistencies"
            echo "Run 'shfmt -w -i 4 -bn -ci <script>' to auto-fix"
            exit 1
          fi
          echo "All scripts are consistently formatted"

  # ===========================================================================
  # Job 5: bashate Style Check
  # ===========================================================================
  bashate:
    name: Style Check (bashate)
    runs-on: ubuntu-latest
    needs: discover-scripts
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install bashate (pinned, hash-verified)
        run: |
          # bashate==2.1.1 and its dependencies (pbr, setuptools), each pinned
          # with the sha256 of its wheel and sdist in .github/ci/requirements.txt;
          # pip refuses anything else. A venv keeps the system Python untouched.
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-venv
          python3 -m venv "${RUNNER_TEMP}/bashate-venv"
          "${RUNNER_TEMP}/bashate-venv/bin/pip" install --quiet --disable-pip-version-check \
            --require-hashes -r .github/ci/requirements.txt
          echo "${RUNNER_TEMP}/bashate-venv/bin" >> "$GITHUB_PATH"
          echo "Installed: $("${RUNNER_TEMP}/bashate-venv/bin/bashate" --version)"

      - name: Run bashate style check
        run: |
          echo "============================================"
          echo "bashate Style Check (OpenStack)"
          echo "============================================"
          echo ""

          # bashate checks for common style issues
          # Ignore some rules that conflict with other tools:
          #   E006: Line too long (we use shellcheck for this)
          #   E040: Syntax error (we use bash -n for this)
          #   E001: Trailing whitespace (handled by shfmt)
          #   E042: local declaration hides errors (valid pattern in bash)
          #   E043: Arithmetic compound semantics (valid bash patterns)

          errors=0

          while IFS= read -r script; do
            echo "Checking: $script"
            if ! bashate --ignore E001,E006,E040,E042,E043 "$script"; then
              errors=$((errors + 1))
            fi
          done < <(find . -name '*.sh' -type f | sort)

          echo ""
          echo "============================================"

          if [[ $errors -gt 0 ]]; then
            echo "::error::bashate found style issues in ${errors} script(s)"
            exit 1
          fi
          echo "All scripts pass bashate style checks"

  # ===========================================================================
  # Job 6: Security Scan (basic checks)
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: discover-scripts
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Basic security checks
        id: security
        run: |
          echo "============================================"
          echo "Security Pattern Scan"
          echo "============================================"
          echo ""

          warnings=0
          declare -a warning_details=()

          # ----------------------------------------------------------------
          # 1. Check for dangerous eval usage
          # ----------------------------------------------------------------
          echo "1. Checking for dangerous 'eval' patterns..."

          # Match eval that's NOT:
          # - In a comment (starts with #)
          # - Part of 'yq eval', 'jq eval', or similar tool commands
          # - The safe getopt pattern: eval set --
          dangerous_eval=$(grep -rn --include='*.sh' '^\s*eval\s' . 2>/dev/null \
            | grep -v 'eval set --' \
            | grep -v '#.*eval' \
            || true)

          if [[ -n "$dangerous_eval" ]]; then
            echo "$dangerous_eval"
            echo "   [WARN] Found potentially dangerous eval - review for command injection"
            warnings=$((warnings + 1))
            warning_details+=("Dangerous eval patterns found")
          else
            echo "   [OK] No dangerous eval patterns (safe patterns like 'eval set --' are OK)"
          fi
          echo ""

          # ----------------------------------------------------------------
          # 2. Check for curl/wget without certificate verification
          # ----------------------------------------------------------------
          echo "2. Checking for insecure downloads..."

          insecure_dl=$(grep -rn --include='*.sh' -E '(curl|wget).*(-k|--insecure|--no-check-certificate)' . 2>/dev/null || true)

          if [[ -n "$insecure_dl" ]]; then
            echo "$insecure_dl"
            echo "   [WARN] Found downloads with disabled certificate verification"
            warnings=$((warnings + 1))
            warning_details+=("Insecure download flags")
          else
            echo "   [OK] No insecure download flags found"
          fi
          echo ""

          # ----------------------------------------------------------------
          # 3. Check for world-writable permissions
          # ----------------------------------------------------------------
          echo "3. Checking for overly permissive chmod..."

          world_writable=$(grep -rn --include='*.sh' -E 'chmod\s+[0-7]*777|chmod\s+[0-7]*666' . 2>/dev/null \
            | grep -v '#' \
            || true)

          if [[ -n "$world_writable" ]]; then
            echo "$world_writable"
            echo "   [WARN] Found world-writable permissions"
            warnings=$((warnings + 1))
            warning_details+=("World-writable permissions")
          else
            echo "   [OK] No world-writable permissions found"
          fi
          echo ""

          # ----------------------------------------------------------------
          # 4. Check for shell injection via unquoted command substitution
          # ----------------------------------------------------------------
          echo "4. Checking for unquoted command substitutions in dangerous commands..."

          # Look for rm/mv with unquoted $(...) - a real injection risk
          # (the single-quoted '"$(' below is the text being searched for)
          # shellcheck disable=SC2016
          unquoted_cmd=$(grep -rn --include='*.sh' -E '(rm|mv|cp)\s+-[rf]*\s+\$\(' . 2>/dev/null \
            | grep -v '"$(' \
            | grep -v '#' \
            || true)

          if [[ -n "$unquoted_cmd" ]]; then
            echo "$unquoted_cmd"
            echo "   [WARN] Found unquoted command substitution in file operations"
            warnings=$((warnings + 1))
            warning_details+=("Unquoted command substitution")
          else
            echo "   [OK] No unquoted command substitution risks found"
          fi
          echo ""

          # ----------------------------------------------------------------
          # 5. Check for hardcoded secrets (refined pattern)
          # ----------------------------------------------------------------
          echo "5. Checking for hardcoded secrets..."

          # Look for actual assignments with values, not just variable names
          # Exclude: comments, empty assignments, environment variable refs
          hardcoded=$(grep -rn --include='*.sh' -E '(PASSWORD|SECRET|API_KEY|APIKEY|PRIVATE_KEY)=["\x27][^"\x27$]+["\x27]' . 2>/dev/null \
            | grep -v '#' \
            | grep -v '=""' \
            | grep -v "=''" \
            || true)

          if [[ -n "$hardcoded" ]]; then
            echo "$hardcoded"
            echo "   [WARN] Found potential hardcoded secrets"
            warnings=$((warnings + 1))
            warning_details+=("Hardcoded secrets")
          else
            echo "   [OK] No hardcoded secrets found"
          fi
          echo ""

          # ----------------------------------------------------------------
          # 6. Check for temporary file race conditions
          # ----------------------------------------------------------------
          echo "6. Checking for insecure temp file patterns..."

          # Look for /tmp with predictable names (not mktemp)
          insecure_tmp=$(grep -rn --include='*.sh' -E '/tmp/[a-zA-Z0-9_-]+\.(sh|txt|log|tmp)' . 2>/dev/null \
            | grep -v 'mktemp' \
            | grep -v '#' \
            | head -5 \
            || true)

          if [[ -n "$insecure_tmp" ]]; then
            echo "$insecure_tmp"
            echo "   [WARN] Found predictable temp file names (consider using mktemp)"
            warnings=$((warnings + 1))
            warning_details+=("Predictable temp files")
          else
            echo "   [OK] No insecure temp file patterns found"
          fi
          echo ""

          # ----------------------------------------------------------------
          # Summary
          # ----------------------------------------------------------------
          echo "============================================"
          echo "Security scan complete: ${warnings} warning(s)"
          echo "============================================"

          # Export for summary
          echo "warning_count=${warnings}" >> "$GITHUB_OUTPUT"
          if [[ ${#warning_details[@]} -gt 0 ]]; then
            echo "warning_list=${warning_details[*]}" >> "$GITHUB_OUTPUT"
          else
            echo "warning_list=None" >> "$GITHUB_OUTPUT"
          fi

      - name: Security Summary Report
        if: always()
        env:
          WARNING_COUNT: ${{ steps.security.outputs.warning_count }}
          WARNING_LIST: ${{ steps.security.outputs.warning_list }}
        run: |
          {
            echo "## Security Scan Report"
            echo ""
            if [[ -z "${WARNING_COUNT}" ]]; then
              echo "The scan did not finish; see the step log."
            elif [[ "${WARNING_COUNT}" == "0" ]]; then
              echo "No pattern matched (eval, insecure downloads, world-writable chmod, unquoted command substitution in rm/mv/cp, hardcoded secrets, predictable temp files)."
            else
              echo "${WARNING_COUNT} pattern(s) matched: ${WARNING_LIST}. The step log lists the lines."
            fi
            echo ""
            echo "_Note: This scan uses pattern matching and may have false positives/negatives._"
            echo "_ShellCheck provides more comprehensive variable quoting analysis._"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Job 7: Bats Test Suite (Required)
  # ===========================================================================
  bats-tests:
    name: Bats Tests
    runs-on: ubuntu-latest
    needs: discover-scripts
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install bats
        run: |
          # jq and python3-yaml: tests/test_ci_config.bats reads the workflows
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats jq python3-yaml

      - name: Run bats test suite
        env:
          # Also fail when the suite changes host state outside TMPDIR (see the header of tests/check_tmp_leaks.sh)
          LYREBIRD_LEAK_CHECK_HOST: '1'
        run: |
          echo "============================================"
          echo "Bats Test Suite: $(bats --version)"
          echo "============================================"
          # Keep bats' working files off any shared /tmp cleanup path
          export TMPDIR="${RUNNER_TEMP:-/tmp}"

          # Runs the suite in a fresh TMPDIR and also fails on leaked temp files
          if tests/check_tmp_leaks.sh; then
            echo "All bats tests passed"
          else
            echo "::error::Bats tests failed or left temp files behind"
            exit 1
          fi

  # ===========================================================================
  # Job 7b: Live tests against real MediaMTX releases (checksum-pinned)
  #
  # One job per version, in parallel, so a failure names its version in the
  # job list ("Live MediaMTX v1.19.0") instead of hiding in one long run.
  # Every version here needs a sha256 pin in tests/fetch_mediamtx.sh and vice
  # versa (tests/test_ci_config.bats checks both).
  # ===========================================================================
  live-mediamtx:
    name: Live MediaMTX ${{ matrix.version }}
    runs-on: ubuntu-latest
    needs: discover-scripts
    strategy:
      fail-fast: false
      matrix:
        version:
          - v1.15.0
          - v1.18.0
          - v1.19.0
          - v1.21.1
          - v1.21.2
          - v1.21.3
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats ffmpeg jq curl

      - name: Run live tests for one MediaMTX version
        env:
          MEDIAMTX_VERSION: ${{ matrix.version }}
        run: |
          export TMPDIR="${RUNNER_TEMP:-/tmp}"
          LYREBIRD_TEST_MEDIAMTX_BINS="$(tests/fetch_mediamtx.sh "$RUNNER_TEMP/mediamtx" "$MEDIAMTX_VERSION")"
          export LYREBIRD_TEST_MEDIAMTX_BINS
          tests/check_tmp_leaks.sh --print-output-on-failure --timing \
            tests/test_mediamtx_live.bats tests/test_soak_live.bats tests/test_soak_observer.bats \
            tests/test_mediamtx_config_live.bats tests/test_mediamtx_api_live.bats tests/test_mediamtx_e2e_ports.bats \
            tests/test_install_mediamtx_live.bats tests/test_stream_names.bats tests/test_docs_security.bats

  # ===========================================================================
  # Job 7c: Canary against the newest upstream MediaMTX release
  #
  # ADVISORY, NON-BLOCKING: `continue-on-error`, and deliberately not in the
  # summary job's needs. It resolves the newest stable upstream release at run
  # time, verifies the tarball against the checksums.sha256 published with
  # that release, and runs the same live tests, so a release that breaks the
  # generated config shows up here before it is pinned above. It does not run
  # for tag pushes (release validation).
  # ===========================================================================
  live-mediamtx-canary:
    name: Live MediaMTX newest upstream (advisory, non-blocking)
    runs-on: ubuntu-latest
    needs: discover-scripts
    continue-on-error: true
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats ffmpeg jq curl

      - name: Run live tests against the newest upstream release
        run: |
          export TMPDIR="${RUNNER_TEMP:-/tmp}"
          LYREBIRD_TEST_MEDIAMTX_BINS="$(tests/fetch_mediamtx.sh "$RUNNER_TEMP/mediamtx" latest)"
          export LYREBIRD_TEST_MEDIAMTX_BINS
          version="$(basename "$(dirname "$LYREBIRD_TEST_MEDIAMTX_BINS")")"
          echo "Canary (advisory): MediaMTX ${version}, newest upstream release" >> "$GITHUB_STEP_SUMMARY"
          tests/check_tmp_leaks.sh --print-output-on-failure --timing \
            tests/test_mediamtx_live.bats tests/test_soak_live.bats tests/test_soak_observer.bats \
            tests/test_mediamtx_config_live.bats tests/test_mediamtx_api_live.bats tests/test_mediamtx_e2e_ports.bats \
            tests/test_install_mediamtx_live.bats tests/test_stream_names.bats tests/test_docs_security.bats

  # ===========================================================================
  # Job 8: Final Summary
  #
  # The one check that says whether the pipeline passed. It needs EVERY job
  # above (the advisory canary excepted: it is not a gate and is not listed)
  # and fails unless each of them finished as "success": a failed, cancelled
  # or skipped job all fail it. Make this job the required status check in
  # branch protection.
  # ===========================================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - discover-scripts
      - workflow-lint
      - bash-syntax
      - shellcheck
      - shfmt
      - bashate
      - security-scan
      - bats-tests
      - live-mediamtx
    if: always()
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      SCRIPT_COUNT: ${{ needs.discover-scripts.outputs.script_count }}
    steps:
      - name: Report job results
        run: |
          {
            echo "# Bash CI Pipeline Results"
            echo ""
            echo "Every job below is required: the pipeline passes only if all of them succeed."
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$NEEDS_JSON"
            echo ""
            echo "## Tools"
            echo ""
            echo "| Tool | Version |"
            echo "|------|---------|"
            echo "| ShellCheck | ${SHELLCHECK_VERSION} |"
            echo "| shfmt | ${SHFMT_VERSION} |"
            echo "| actionlint | ${ACTIONLINT_VERSION} |"
            echo "| bashate | pinned in .github/ci/requirements.txt |"
            echo ""
            echo "## Reproduce locally"
            echo ""
            echo '```bash'
            echo "bash -n script.sh"
            echo "shellcheck --format=gcc --severity=warning --external-sources --shell=bash script.sh"
            echo "shfmt -d -i 4 -bn -ci script.sh        # fix with: shfmt -w -i 4 -bn -ci script.sh"
            echo "bashate --ignore E001,E006,E040,E042,E043 script.sh"
            echo "tests/check_tmp_leaks.sh               # the whole bats suite"
            echo '```'
            echo ""
            echo "_Scripts analyzed: ${SCRIPT_COUNT}_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require every job to succeed
        run: |
          failed=0
          count=0
          while IFS=$'\t' read -r job result; do
            count=$((count + 1))
            if [[ "$result" == "success" ]]; then
              echo "PASS  ${job}"
            else
              echo "::error::${job} finished as '${result}' (required: success)"
              failed=1
            fi
          done < <(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<<"$NEEDS_JSON")

          if [[ $count -eq 0 ]]; then
            echo "::error::no job results were available to check"
            exit 1
          fi
          if [[ $failed -ne 0 ]]; then
            echo "::error::One or more required jobs did not succeed."
            exit 1
          fi
          echo "All ${count} required jobs succeeded."
