# LyreBirdAudio - GitHub Pages Documentation Deployment
#
# Deploys the static documentation site in docs/ to GitHub Pages
# whenever changes are pushed to the main branch.
#
# Setup (one-time, in repo Settings):
#   Settings → Pages → Source: GitHub Actions
#
# Author: Tom F (https://github.com/tomtom215)
# License: Apache 2.0

name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Only one deployment runs at a time; cancel any in-progress run
# for the same branch so the latest push always wins.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload docs/ as Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Print deployment URL
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: echo "Docs deployed to ${PAGE_URL}"
