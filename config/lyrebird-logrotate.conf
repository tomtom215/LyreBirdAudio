# LyreBirdAudio Log Rotation Configuration
# Prevents disk exhaustion from log accumulation
#
# Installation:
#   sudo cp config/lyrebird-logrotate.conf /etc/logrotate.d/lyrebird
#
# Test configuration:
#   sudo logrotate -d /etc/logrotate.d/lyrebird
#
# Force immediate rotation:
#   sudo logrotate -f /etc/logrotate.d/lyrebird

# One owner per log file: logrotate refuses a log that two files under
# /etc/logrotate.d list ("duplicate log entry"), so this file lists only what
# `sudo ./lyrebird-stream-manager.sh install` does not write. install writes
# /etc/logrotate.d/mediamtx for the three logs whose location the manager
# configures (MEDIAMTX_LOG_FILE, STREAM_MANAGER_LOG_FILE, MEDIAMTX_FFMPEG_DIR):
#   /var/log/mediamtx.out                  MediaMTX's output
#   /var/log/lyrebird-stream-manager.log   the stream manager's log
#   /var/lib/mediamtx-ffmpeg/*.log         the per-stream FFmpeg logs
# (all copytruncate: the writers hold the files open through a redirect or
# systemd append: and do not reopen them). Do not add them here.

# LyreBirdAudio's own log directory: lyrebird-alerts.sh appends alerts.log here
# (the directory lyrebird-storage.sh also sweeps for old logs). No FFmpeg log is
# here: those are the per-stream files above, in /var/lib/mediamtx-ffmpeg.
# copytruncate: the writers keep the file open and do not reopen it on rotate.
/var/log/lyrebird/*.log {
    daily
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    size 10M
    sharedscripts

    # Keep recent logs for troubleshooting, but rotate aggressively
    # to prevent disk fill on devices with many microphones
}

# LyreBird orchestrator and updater logs
/var/log/lyrebird-orchestrator.log
/var/log/lyrebird-updater.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
    size 10M
}

# Diagnostics log (rarely written, keep longer)
/var/log/lyrebird-diagnostics.log {
    monthly
    rotate 6
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
    size 5M
}

# USB audio mapper logs
/var/log/usb-audio-mapper.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
    size 5M
}
